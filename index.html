<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 날씨 & 옷차림 맞춤 추천</title>
  <style>
    :root {
      --primary: #3B82F6;
      --accent: #10B981;
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --text: #1F2937;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.35rem;
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #E5E7EB;
      background: #F9FAFB;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: #6B7280;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.88rem;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .gps-btn {
      background-color: #6B7280;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
      padding: 8px;
      font-size: 0.85rem;
    }

    .submit-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .report-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .result-box {
      margin-top: 20px;
      padding: 18px;
      background-color: #F9FAFB;
      border-radius: 12px;
      border: 1px solid #E5E7EB;
      white-space: pre-line;
      line-height: 1.8;
      font-size: 0.95rem;
    }

    .status-badge {
      background: #EFF6FF;
      color: #1E40AF;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      border: 1px solid #BFDBFE;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🌤️ 야외 날씨 & 옷차림 맞춤 추천</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('recommendTab')">옷차림 추천받기</button>
    <button class="tab-btn" onclick="switchTab('reportTab')">현장 날씨 제보하기</button>
  </div>

  <!-- 1. 옷차림 추천받기 영역 -->
  <div id="recommendTab" class="section active">
    <div class="status-badge" id="reportStatus">
      💡 등록된 제보가 없습니다. 기온, 습도, 강수량, 햇빛 세기를 기반으로 추천합니다.
    </div>

    <form id="recommendForm">
      <div class="form-group">
        <label for="recCitySelect">목적지 선택 (전국 17개 시/도)</label>
        <select id="recCitySelect">
          <option value="서울특별시" data-lat="37.5665" data-lon="126.9780">서울특별시</option>
          <option value="부산광역시" data-lat="35.1796" data-lon="129.0756">부산광역시</option>
          <option value="대구광역시" data-lat="35.8714" data-lon="128.6014">대구광역시</option>
          <option value="인천광역시" data-lat="37.4563" data-lon="126.7052">인천광역시</option>
          <option value="광주광역시" data-lat="35.1595" data-lon="126.8526">광주광역시</option>
          <option value="대전광역시" data-lat="36.3510" data-lon="127.3850">대전광역시</option>
          <option value="울산광역시" data-lat="35.5384" data-lon="129.3114">울산광역시</option>
          <option value="세종특별자치시" data-lat="36.4800" data-lon="127.2890">세종특별자치시</option>
          <option value="경기도" data-lat="37.2750" data-lon="127.0094">경기도</option>
          <option value="강원특별자치도" data-lat="37.8853" data-lon="127.7298">강원특별자치도</option>
          <option value="충청북도" data-lat="36.6358" data-lon="127.4914">충청북도</option>
          <option value="충청남도" data-lat="36.6588" data-lon="126.6728">충청남도</option>
          <option value="전라북도특별자치도" data-lat="35.8242" data-lon="127.1480">전라북도특별자치도</option>
          <option value="전라남도" data-lat="34.8161" data-lon="126.4629">전라남도</option>
          <option value="경상북도" data-lat="36.5760" data-lon="128.5056">경상북도</option>
          <option value="경상남도" data-lat="35.2383" data-lon="128.6924">경상남도</option>
          <option value="제주특별자치도" data-lat="33.4996" data-lon="126.5312">제주특별자치도</option>
        </select>
      </div>

      <button type="submit" class="submit-btn" id="recommendBtn">맞춤 옷차림 추천받기</button>
    </form>

    <div id="loading" style="display:none; text-align:center; margin-top:15px; color:#666;">
      🤖 기상 데이터와 현장 제보를 분석 중입니다...
    </div>
    <div id="result" class="result-box" style="display:none;"></div>
  </div>

  <!-- 2. 현장 날씨 제보하기 영역 -->
  <div id="reportTab" class="section">
    <p style="font-size:0.85rem; color:#666;">지금 야외에 계신가요? 현위치를 확인하고 실시간 날씨를 공유해보세요!</p>

    <form id="reportForm">
      <div class="form-group">
        <label for="repLocation">제보자 위치</label>
        <input type="text" id="repLocation" placeholder="현위치를 불러오거나 직접 입력해주세요">
        <button type="button" class="gps-btn" onclick="getGPSLocation()">📍 현재 위치 자동으로 가져오기</button>
      </div>

      <div class="form-group">
        <label for="repFeelTemp">현재 체감 온도</label>
        <select id="repFeelTemp">
          <option value="매우 더움 🥵">매우 더움 🥵</option>
          <option value="더움 ☀️">더움 ☀️</option>
          <option value="적당함 😊" selected>적당함 😊</option>
          <option value="쌀쌀함 🍃">쌀쌀함 🍃</option>
          <option value="추움 🥶">추움 🥶</option>
        </select>
      </div>

      <div class="form-group">
        <label for="repWeather">현재 현장 날씨</label>
        <select id="repWeather">
          <option value="햇빛 강함 ☀️">햇빛 강함 ☀️</option>
          <option value="바람 많음 💨">바람 많음 💨</option>
          <option value="비/흐림 🌧️">비/흐림 🌧️</option>
          <option value="적당함/화창함 🌤️" selected>적당함/화창함 🌤️</option>
        </select>
      </div>

      <button type="submit" class="report-btn">현장 제보 등록하기</button>
    </form>
  </div>
</div>

<script>
  let sharedReport = null;

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

    if (tabId === 'recommendTab') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('recommendTab').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('reportTab').classList.add('active');
    }
  }

  // 제보자 GPS 자동 위치 조회
  function getGPSLocation() {
    if (!navigator.geolocation) {
      alert("브라우저가 위치 서비스를 지원하지 않습니다.");
      return;
    }

    const locInput = document.getElementById('repLocation');
    locInput.value = "위치 정보 확인 중...";

    navigator.geolocation.getCurrentPosition(async (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
        const data = await res.json();
        const addr = data.address;
        const locationName = `${addr.province || addr.city || ''} ${addr.borough || addr.suburb || ''}`.trim() || "현재 위치";
        locInput.value = locationName;
      } catch (e) {
        locInput.value = `위도:${lat.toFixed(3)}, 경도:${lon.toFixed(3)}`;
      }
    }, () => {
      alert("위치 정보를 가져올 수 없습니다.");
      locInput.value = "";
    });
  }

  // 현장 사용자: 제보 등록
  document.getElementById('reportForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const repLoc = document.getElementById('repLocation').value || "현장 제보 지역";
    
    sharedReport = {
      location: repLoc,
      feelTemp: document.getElementById('repFeelTemp').value,
      weatherCondition: document.getElementById('repWeather').value
    };

    alert('현장 제보가 등록되었습니다!');
    document.getElementById('reportStatus').innerText = `📢 최신 현장 제보 반영됨 [${repLoc}]: 체감 (${sharedReport.feelTemp}), 날씨 (${sharedReport.weatherCondition})`;
    switchTab('recommendTab');
  });

  // 옷차림 추천 요청
  document.getElementById('recommendForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const select = document.getElementById('recCitySelect');
    const selectedOption = select.options[select.selectedIndex];

    const locationName = select.value;
    const lat = selectedOption.dataset.lat;
    const lon = selectedOption.dataset.lon;

    const payload = {
      locationName,
      lat,
      lon,
      hasReport: sharedReport !== null,
      feelTemp: sharedReport?.feelTemp || '',
      weatherCondition: sharedReport?.weatherCondition || '',
      reportLocation: sharedReport?.location || ''
    };

    const btn = document.getElementById('recommendBtn');
    const loading = document.getElementById('loading');
    const resultBox = document.getElementById('result');

    btn.disabled = true;
    loading.style.display = 'block';
    resultBox.style.display = 'none';

    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (response.ok) {
        resultBox.innerText = data.result;
        resultBox.style.display = 'block';
      } else {
        alert('오류 발생: ' + (data.error || '처리 실패'));
      }
    } catch (err) {
      alert('네트워크 오류가 발생했습니다.');
    } finally {
      btn.disabled = false;
      loading.style.display = 'none';
    }
  });
</script>

</body>
</html>
