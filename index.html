<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 야외 날씨 & 옷차림 추천</title>
  <style>
    :root {
      --primary: #4A90E2;
      --accent: #2ECC71;
      --bg: #F4F7F6;
      --card-bg: #FFFFFF;
      --text: #333333;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #DDD;
      background: #EFEFEF;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: #666;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    select, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #DDD;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .submit-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .report-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      background-color: #F8F9FA;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      white-space: pre-line;
      line-height: 1.6;
    }

    .status-badge {
      background: #E3F2FD;
      color: #0D47A1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🌤️ 야외 실시간 옷차림 추천</h1>

  <!-- 탭 메뉴 -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('recommendTab')">옷차림 추천받기</button>
    <button class="tab-btn" onclick="switchTab('reportTab')">현장 날씨 제보하기</button>
  </div>

  <!-- 1. 옷차림 추천받기 영역 (외출 예정 사용자) -->
  <div id="recommendTab" class="section active">
    <div class="status-badge" id="reportStatus">
      📢 현재 공유된 현장 제보가 있습니다.
    </div>

    <form id="recommendForm">
      <div class="form-group">
        <label for="recLocation">목적지 선택</label>
        <select id="recLocation">
          <option value="서울" data-lat="37.5665" data-lon="126.9780">서울</option>
          <option value="부산" data-lat="35.1796" data-lon="129.0756">부산</option>
          <option value="인천" data-lat="37.4563" data-lon="126.7052">인천</option>
          <option value="대구" data-lat="35.8714" data-lon="128.6014">대구</option>
          <option value="광주" data-lat="35.1595" data-lon="126.8526">광주</option>
          <option value="대전" data-lat="36.3510" data-lon="127.3850">대전</option>
          <option value="제주" data-lat="33.4996" data-lon="126.5312">제주</option>
        </select>
      </div>

      <button type="submit" class="submit-btn" id="recommendBtn">현장 데이터 기반 옷추천 받기</button>
    </form>

    <div id="loading" style="display:none; text-align:center; margin-top:15px; color:#666;">
      🤖 현장 제보 정보와 날씨 데이터를 분석 중입니다...
    </div>
    <div id="result" class="result-box" style="display:none;"></div>
  </div>

  <!-- 2. 현장 날씨 제보하기 영역 (현재 야외에 있는 사용자) -->
  <div id="reportTab" class="section">
    <p style="font-size:0.85rem; color:#666;">지금 야외에 계신가요? 나중에 이곳에 올 사람들을 위해 실시간 체감 날씨를 제보해주세요!</p>

    <form id="reportForm">
      <div class="form-group">
        <label for="repFeelTemp">현재 체감 온도</label>
        <select id="repFeelTemp">
          <option value="매우 더움 🥵">매우 더움 🥵</option>
          <option value="더움 ☀️">더움 ☀️</option>
          <option value="적당함 😊" selected>적당함 😊</option>
          <option value="쌀쌀함 🍃">쌀쌀함 🍃</option>
          <option value="추움 🥶">추움 🥶</option>
        </select>
      </div>

      <div class="form-group">
        <label for="repWeather">현재 현장 날씨</label>
        <select id="repWeather">
          <option value="햇빛 강함 ☀️">햇빛 강함 ☀️</option>
          <option value="바람 많음 💨">바람 많음 💨</option>
          <option value="비 온다 / 흐림 🌧️">비 온다 / 흐림 🌧️</option>
          <option value="적당함/화창함 🌤️" selected>적당함/화창함 🌤️</option>
        </select>
      </div>

      <button type="submit" class="report-btn">현장 상태 제보하기</button>
    </form>
  </div>
</div>

<script>
  // 임시 메모리 저장용 현장 데이터 (기본값 설정)
  let sharedReport = {
    feelTemp: '적당함 😊',
    weatherCondition: '적당함/화창함 🌤️'
  };

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

    if (tabId === 'recommendTab') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('recommendTab').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('reportTab').classList.add('active');
    }
  }

  // 현장 사용자: 제보 제출
  document.getElementById('reportForm').addEventListener('submit', (e) => {
    e.preventDefault();
    sharedReport.feelTemp = document.getElementById('repFeelTemp').value;
    sharedReport.weatherCondition = document.getElementById('repWeather').value;

    alert('제보가 등록되었습니다! 다른 이용자들에게 전달됩니다.');
    document.getElementById('reportStatus').innerText = `📢 최신 현장 제보 반영됨: 체감 (${sharedReport.feelTemp}), 날씨 (${sharedReport.weatherCondition})`;
    switchTab('recommendTab');
  });

  // 추천 요청 사용자: AI 추천 요청
  document.getElementById('recommendForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const select = document.getElementById('recLocation');
    const selectedOption = select.options[select.selectedIndex];

    const payload = {
      city: select.value,
      lat: selectedOption.dataset.lat,
      lon: selectedOption.dataset.lon,
      feelTemp: sharedReport.feelTemp,
      weatherCondition: sharedReport.weatherCondition
    };

    const btn = document.getElementById('recommendBtn');
    const loading = document.getElementById('loading');
    const resultBox = document.getElementById('result');

    btn.disabled = true;
    loading.style.display = 'block';
    resultBox.style.display = 'none';

    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (response.ok) {
        resultBox.innerText = data.result;
        resultBox.style.display = 'block';
      } else {
        alert('오류 발생: ' + (data.error || '처리 실패'));
      }
    } catch (err) {
      alert('네트워크 오류가 발생했습니다.');
    } finally {
      btn.disabled = false;
      loading.style.display = 'none';
    }
  });
</script>

</body>
</html>
